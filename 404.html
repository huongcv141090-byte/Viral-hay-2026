<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — ViralForge 2026</title>
    <style>
        :root { --bg: #0d0d0f; --primary: #a78bfa; --text: #e2e8f0; --muted: #64748b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            text-align: center;
            padding: 2rem;
        }
        .emoji  { font-size: 4rem; }
        h1      { font-size: 2rem; font-weight: 700; color: var(--primary); }
        p       { color: var(--muted); max-width: 360px; line-height: 1.6; }
        a {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.65rem 1.5rem;
            background: var(--primary);
            color: #0d0d0f;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        a:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="emoji">🎬</div>
    <h1>404 — Trang không tồn tại</h1>
    <p>Trang bạn tìm kiếm đã bị xoá hoặc chưa được tạo.<br />Quay về trang chủ để tiếp tục sản xuất nội dung viral.</p>
    <a href="/">← Về trang chủ</a>
</body>
</html>
